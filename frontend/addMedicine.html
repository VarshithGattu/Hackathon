<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Medicine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">MedReminder</a>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 mb-0">Add Medicine</h2>
        </div>

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label small">Medicine name</label>
            <input id="mname" class="form-control" placeholder="e.g. Aspirin">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label small">Dosage</label>
            <input id="mdose" class="form-control" placeholder="e.g. 500 mg">
          </div>
          <div class="col-12">
            <label class="form-label small">Schedule times</label>
            <input id="mschedule" class="form-control" placeholder="09:00, 21:00">
            <div class="form-text">Comma-separated times (24h)</div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label small">Start date</label>
            <input id="mstart" class="form-control" type="date">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label small">End date</label>
            <input id="mend" class="form-control" type="date">
          </div>
          <div class="col-12">
            <label class="form-label small">Repeat pattern</label>
            <input id="mrepeat" class="form-control" placeholder="e.g. Daily, weekdays">
          </div>
          <div class="col-12">
            <label class="form-label small">Notes</label>
            <textarea id="mnotes" class="form-control" rows="3" placeholder="Optional notes"></textarea>
          </div>
        </div>

        <div class="d-flex justify-content-end mt-3">
          <button class="btn btn-primary" onclick="addMedicine()"><i class="fa-solid fa-flask-vial me-2"></i>Add Medicine</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
