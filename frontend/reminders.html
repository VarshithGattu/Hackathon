<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reminders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">MedReminder</a>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="d-flex align-items-center justify-content-between">
        <h1 class="h5 mb-0">Reminders Today</h1>
        <div class="input-group" style="max-width:320px">
          <input id="reminderSearch" class="form-control form-control-sm" placeholder="Search medicines...">
          <button class="btn btn-outline-secondary btn-sm" id="clearSearch" title="Clear"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div id="reminderList" class="list-group mt-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
