<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medicine Reminder - Login</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">MedReminder</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>

  <main class="hero d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 72px)">
      <div class="card shadow-sm p-4" style="max-width:420px; width:100%;">
        <div class="text-center mb-3">
          <i class="fa-solid fa-pills fa-2x text-primary"></i>
          <h2 class="h4 mt-2">Welcome back</h2>
          <p class="text-muted small">Sign in to manage reminders</p>
        </div>

        <div class="mb-3">
          <label class="form-label small">Email</label>
          <input id="email" class="form-control" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input id="password" class="form-control" placeholder="Password" type="password">
        </div>
        <div class="d-grid gap-2">
          <button class="btn btn-primary" onclick="login()"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</button>
        </div>
        <div class="text-center mt-3">
          <small class="text-muted">or <a href="register.html">Create an account</a></small>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
