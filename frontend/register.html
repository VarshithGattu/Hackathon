<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">MedReminder</a>
      </div>
    </nav>

    <main class="d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 72px)">
      <div class="card shadow-sm p-4" style="max-width:520px; width:100%;">
        <div class="text-center mb-3">
          <i class="fa-solid fa-user-plus fa-2x text-primary"></i>
          <h2 class="h5 mt-2">Create account</h2>
          <p class="text-muted small">Register to start scheduling reminders</p>
        </div>

        <div class="row g-2">
          <div class="col-12">
            <label class="form-label small">Name</label>
            <input id="name" class="form-control" placeholder="Full name">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label small">Email</label>
            <input id="email" class="form-control" placeholder="you@example.com">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label small">Phone</label>
            <input id="phone" class="form-control" placeholder="Phone number">
          </div>
          <div class="col-12">
            <label class="form-label small">Password</label>
            <input id="password" class="form-control" placeholder="Password" type="password">
          </div>
        </div>

        <div class="d-grid mt-3">
          <button class="btn btn-success" onclick="register()"><i class="fa-solid fa-user-check me-2"></i>Register</button>
        </div>
        <div class="text-center mt-3">
          <small class="text-muted">Already have an account? <a href="index.html">Sign in</a></small>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
