<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">MedReminder</a>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="card p-3">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="h5 mb-0">Adherence History</h2>
        </div>

        <div class="row g-2 align-items-center mb-3">
          <div class="col-auto">
            <label class="form-label small mb-0">From</label>
            <input id="from" type="date" class="form-control">
          </div>
          <div class="col-auto">
            <label class="form-label small mb-0">To</label>
            <input id="to" type="date" class="form-control">
          </div>
          <div class="col-auto">
            <label class="d-block mb-0">&nbsp;</label>
            <button class="btn btn-outline-primary" onclick="loadHistory()"><i class="fa-solid fa-filter me-1"></i>Load</button>
          </div>
        </div>

        <ul id="historyList" class="list-group"></ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
