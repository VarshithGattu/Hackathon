<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">MedReminder</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="addMedicine.html"><i class="fa-solid fa-plus me-1"></i>Add Medicine</a></li>
            <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="fa-regular fa-clock me-1"></i>Reminders</a></li>
            <li class="nav-item"><a class="nav-link" href="history.html"><i class="fa-solid fa-chart-line me-1"></i>History</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="fa-solid fa-sign-out-alt me-1"></i>Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row g-3 mt-4 mb-3">
        <div class="col-12 col-md-8">
          <div class="d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Today's Reminders</h1>
            <small class="text-muted">Auto-refresh every 30s</small>
          </div>
          <div id="reminderList" class="list-group mt-3"></div>
        </div>

        <div class="col-12 col-md-4">
          <div id="adherenceCard" class="card p-3">
            <h2 class="h6 mb-2">Adherence (7 days)</h2>
            <div id="adherencePercent" class="display-6 text-primary">--%</div>
            <div class="progress mt-2" style="height:12px">
              <div id="adherenceBar" class="progress-bar bg-success" role="progressbar" style="width:0%"></div>
            </div>
            <div id="adherenceText" class="small text-muted mt-2">Loading...</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
